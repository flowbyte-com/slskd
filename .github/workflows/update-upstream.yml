name: Check Upstream Updates

# This workflow is intentionally manual (workflow_dispatch) so that `master`
# can keep tracking upstream slskd without a scheduled workflow file being
# present on the default branch.
#
# Scheduling options (require explicit approval before enabling):
#   1. Change the repository's default branch to `custom` (Settings -> Branches),
#      then add `schedule: - cron: '0 0 * * 0'` to the `on:` block below.
#   2. Keep `master` as the default branch and trigger this workflow manually
#      from the Actions tab (or via `gh workflow run update-upstream.yml --ref custom`).
#   3. Use a separate automation branch as the default branch.
#
# The workflow never merges or deploys anything automatically.  It only
# creates a reviewable candidate branch and pull request targeting `custom`.

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Branch to merge upstream into'
        required: false
        default: 'custom'
      upstream_branch:
        description: 'Upstream branch to track'
        required: false
        default: 'master'

permissions:
  contents: read

jobs:
  check:
    name: Check for new upstream commits
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.diff.outputs.has_updates }}
      upstream_sha: ${{ steps.diff.outputs.upstream_sha }}
      new_count: ${{ steps.diff.outputs.new_count }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch || 'custom' }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/slskd/slskd.git
          git fetch upstream ${{ inputs.upstream_branch || 'master' }}

      - name: Compare base with upstream
        id: diff
        run: |
          set -euo pipefail
          UPSTREAM_SHA=$(git rev-parse upstream/${{ inputs.upstream_branch || 'master' }})
          BASE_SHA=$(git rev-parse HEAD)
          NEW_COUNT=$(git rev-list --count "$BASE_SHA..$UPSTREAM_SHA")
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$NEW_COUNT" = "0" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits. Nothing to do."
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "$NEW_COUNT new upstream commit(s):"
            git log --oneline "$BASE_SHA..$UPSTREAM_SHA" | head -20
          fi

  update:
    name: Merge, validate and propose update
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch || 'custom' }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/slskd/slskd.git
          git fetch upstream ${{ inputs.upstream_branch || 'master' }}

      - name: Create candidate branch
        id: candidate
        run: |
          set -euo pipefail
          UPSTREAM_SHA=$(git rev-parse upstream/${{ inputs.upstream_branch || 'master' }})
          SHORT=$(git rev-parse --short "$UPSTREAM_SHA")
          DATE=$(date +%Y%m%d)
          NAME="update/upstream-${DATE}-${SHORT}"
          n=2
          while git rev-parse --verify --quiet "$NAME" >/dev/null; do
            NAME="update/upstream-${DATE}-${SHORT}-${n}"
            n=$((n + 1))
          done
          git checkout -b "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into candidate
        id: merge
        run: |
          set -euo pipefail
          if git merge --no-ff --no-edit upstream/${{ inputs.upstream_branch || 'master' }}; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
            # leave the candidate branch in place for manual resolution
            exit 1
          fi

      - name: Install frontend dependencies
        run: |
          cd src/web
          npm ci

      - name: Run frontend tests
        run: |
          cd src/web
          npm run test-unattended

      - name: Run frontend lint
        run: |
          cd src/web
          npm run lint

      - name: Run .NET tests
        run: |
          dotnet test --configuration Release tests/slskd.Tests.Unit

      - name: Build Linux x64 release
        run: |
          ./bin/build --version "candidate-${{ steps.candidate.outputs.name }}" --skip-tests
          ./bin/publish --no-prebuild --runtime linux-x64 --version "candidate-${{ steps.candidate.outputs.name }}" --output "dist/candidate"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slskd-custom-candidate
          path: dist/candidate
          if-no-files-found: error

      - name: Push candidate branch
        run: git push origin ${{ steps.candidate.outputs.name }}

      - name: Check for an existing candidate pull request
        id: existing
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --repo ${{ github.repository }} --state open --head ${{ github.repository_owner }}:${{ steps.candidate.outputs.name }} --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "found=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request against custom
        if: steps.existing.outputs.found == ''
        run: |
          gh pr create \
            --repo ${{ github.repository }} \
            --base ${{ inputs.base_branch || 'custom' }} \
            --head ${{ steps.candidate.outputs.name }} \
            --title "chore: merge upstream slskd into custom (${{ needs.check.outputs.upstream_sha }})" \
            --body "Automated upstream update candidate.\n\nUpstream commit: ${{ needs.check.outputs.upstream_sha }}\nNew commits: ${{ needs.check.outputs.new_count }}\n\nThis PR was generated by the \`update-upstream.yml\` workflow.  Review the diff, resolve any conflicts, and merge when ready.  The workflow never merges automatically."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report existing pull request
        if: steps.existing.outputs.found != ''
        run: |
          echo "An open candidate pull request already exists: #${{ steps.existing.outputs.found }}"
          echo "Update that branch instead of creating a duplicate."
